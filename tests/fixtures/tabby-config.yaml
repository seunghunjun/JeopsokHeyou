# Sample Tabby config for tests - contains no real servers.
# 192.0.2.0/24 and 198.51.100.0/24 are reserved for documentation (RFC 5737).
version: 3
groups:
  - id: 11111111-1111-4111-8111-111111111111
    name: Development
  - id: 22222222-2222-4222-8222-222222222222
    name: Staging
  - id: 33333333-3333-4333-8333-333333333333
    name: Production
profiles:
  - type: ssh
    name: dev-01
    group: 11111111-1111-4111-8111-111111111111
    options:
      host: 192.0.2.10
      privateKeys: []
  - type: ssh
    name: staging-01
    group: 22222222-2222-4222-8222-222222222222
    options:
      host: 192.0.2.20
      privateKeys: []
  - type: ssh
    name: prod-master
    group: 33333333-3333-4333-8333-333333333333
    options:
      host: 198.51.100.1
      auth: password
  - type: ssh
    name: prod-web-01
    group: 33333333-3333-4333-8333-333333333333
    options:
      host: 198.51.100.2
      privateKeys: []
  - type: ssh
    name: prod-web-02
    group: 33333333-3333-4333-8333-333333333333
    options:
      host: 198.51.100.3
      privateKeys: []
  - type: ssh
    name: prod-db
    group: 33333333-3333-4333-8333-333333333333
    options:
      host: 198.51.100.4
      auth: password
  - type: local
    name: Local terminal (must not be imported)
